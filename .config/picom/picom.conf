backend = "glx";
vsync = true;

corner-radius = 0;
rounded-corners-exclude = [ "window_type = 'dock'", "class_g = 'Rofi'", "class_g = 'Dunst'" ];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;
shadow-exclude = [ "class_g = 'flameshot'" ];

fading = false;
fade-delta = 4;

# inactive-opacity = 0.72;
# active-opacity = 0.8

opacity-rule = [
  "80:class_g = 'Gnome-terminal' && focused",
  "75:class_g = 'Gnome-terminal' && !focused",
  "80:class_g = 'kitty' && focused",
  "75:class_g = 'kitty' && !focused"
];

blur-method = "dual_kawase";
blur-strength = 5;


