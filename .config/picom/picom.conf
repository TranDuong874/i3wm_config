backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [ "window_type = 'dock'" ];

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.4;

fading = true;
fade-delta = 4;

# inactive-opacity = 0.72;
# active-opacity = 0.8

opacity-rule = [
  "85:class_g = 'Gnome-terminal' && focused",
  "75:class_g = 'Gnome-terminal' && !focused"
];

blur-method = "dual_kawase";
blur-strength = 5;
