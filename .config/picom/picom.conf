backend = "glx";
vsync = true;

# Rounded corners
corner-radius = 12;

# Shadows
shadow = true;
shadow-radius = 15;
shadow-opacity = 0.25;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Transparency
inactive-opacity = 0.96;
active-opacity = 1.0;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Background blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
