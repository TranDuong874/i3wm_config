[colors]
bg      = #1e1e2e
surface = #313244
line    = #45475a
fg      = #cdd6f4
fg-dim  = #6c7086
accent  = #cba6f7
accent2 = #89b4fa
urgent  = #f38ba8

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-bottom-size = 1
border-bottom-color = ${colors.line}
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.line}
font-0 = "DejaVu Sans Mono:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
modules-left = i3
modules-center = xwindow
modules-right = backlight pulseaudio network battery date tray screenshot power
cursor-click = pointer
enable-ipc = true
wm-restack = i3

; ---------- left: workspaces + i3 mode ----------
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>

label-focused = %index%
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

label-mode = %mode%
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1

; ---------- center: window title ----------
[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.fg-dim}

; ---------- right ----------
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <label-volume>
label-volume = %{F#cba6f7}󰕾%{F-} %percentage%%
label-muted = 󰖁 muted
label-muted-foreground = ${colors.fg-dim}
click-right = pavucontrol &

[module/network]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:i3-sensible-terminal -e nmtui &:}<label-connected>%{A}
format-disconnected = %{A1:i3-sensible-terminal -e nmtui &:}<label-disconnected>%{A}
label-connected = %{F#cba6f7}󰖩%{F-} %essid%
label-disconnected = 󰖪 offline
label-disconnected-foreground = ${colors.fg-dim}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP0
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = %{F#89b4fa}󰂄%{F-} %percentage%%
label-discharging = %percentage%%
label-full = %{F#89b4fa}󰁹%{F-} full
format-low = <label-low>
label-low = 󰂃 %percentage%%
label-low-foreground = ${colors.urgent}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %{F#cba6f7}%time%%{F-}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 66%

[module/backlight]
type = internal/backlight
; same device brightnessctl uses for the brightness keys
card = nvidia_wmi_ec_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.accent}

[module/screenshot]
type = custom/text
format = 󰄀
format-foreground = ${colors.accent}
click-left = flameshot gui &
click-right = flameshot screen -c &

[module/power]
type = custom/text
format = 󰐥
format-foreground = ${colors.urgent}
format-padding = 1
; same prompt as $mod+Shift+e for now; swap to ~/.local/bin/powermenu once it exists
click-left = i3-nagbar -t warning -m 'Exit i3?' -B 'Yes, exit i3' 'i3-msg exit' &

[settings]
screenchange-reload = true
