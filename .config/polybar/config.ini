[colors]
bg      = #1e1e2e
surface = #313244
line    = #45475a
fg      = #cdd6f4
fg-dim  = #6c7086
accent  = #cba6f7
accent2 = #89b4fa
urgent  = #f38ba8

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
background = ${colors.bg}
foreground = ${colors.fg}
line-size = 2
border-bottom-size = 1
border-bottom-color = ${colors.line}
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.line}
font-0 = "DejaVu Sans Mono:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=10;2"
modules-left = i3
modules-center = xwindow
modules-right = backlight pulseaudio network battery date ibus tray dashboard screenshot power
cursor-click = pointer
enable-ipc = true
wm-restack = i3

; ---------- left: workspaces + i3 mode ----------
[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
enable-scroll = false
format = <label-state> <label-mode>

label-focused = %index%
label-focused-background = ${colors.surface}
label-focused-foreground = ${colors.accent}
label-focused-underline = ${colors.accent}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.fg-dim}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.fg}
label-visible-padding = 2

label-urgent = %index%
label-urgent-background = ${colors.urgent}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 2

label-mode = %mode%
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1

; ---------- center: window title ----------
[module/xwindow]
type = internal/xwindow
label = %title:0:60:…%
label-foreground = ${colors.fg-dim}

; ---------- right ----------
[module/pulseaudio]
type = internal/pulseaudio
interval = 5
format-volume = <label-volume>
label-volume = %{F#cba6f7}󰕾%{F-} %percentage%%
label-muted = 󰖁 muted
label-muted-foreground = ${colors.fg-dim}
click-right = pavucontrol &

[module/network]
; shows the connection traffic really uses (LAN or Wi-Fi), see scripts/network.sh
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 3
format = %{A1:kitty -e nmtui &:}<label>%{A}

[module/ibus]
; input method: EN / VI (IBus + Unikey). Click or Super+Space to switch. scripts/ibus.sh
type = custom/script
exec = ~/.config/polybar/scripts/ibus.sh
interval = 1
format = %{A1:~/.config/polybar/scripts/ibus.sh toggle &:}<label>%{A}

[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 5
format-charging = <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <label-full>
label-charging = %{F#89b4fa}󰂄%{F-} %percentage%%
label-discharging = %percentage%%
label-full = %{F#89b4fa}󰁹%{F-} full
format-low = <label-low>
label-low = 󰂃 %percentage%%
label-low-foreground = ${colors.urgent}
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰁹
ramp-capacity-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %{A1:eww open --toggle calendar &:}%date%  %{F#cba6f7}%time%%{F-}%{A}

[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 66%

[module/backlight]
type = internal/backlight
; same device brightnessctl uses for the brightness keys
card = nvidia_wmi_ec_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.accent}

[module/dashboard]
type = custom/text
format = 󰕮
format-foreground = ${colors.accent}
click-left = eww open --toggle dashboard &

[module/screenshot]
type = custom/text
format = 󰄀
format-foreground = ${colors.accent}
click-left = flameshot gui &
click-right = flameshot screen -c &

[module/power]
type = custom/text
format = 󰐥
format-foreground = ${colors.urgent}
format-padding = 1
click-left = ~/.local/bin/powermenu &

[settings]
screenchange-reload = true
