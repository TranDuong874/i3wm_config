# cava config for the show-off workspace music pane (~/.local/bin/showoff)
[general]
framerate = 60
bar_width = 2
bar_spacing = 1
sleep_timer = 3

[input]
method = pulse
source = auto

[output]
method = noncurses

[color]
# Catppuccin Mocha: mauve at the bottom → pink → blue at the top
gradient = 1
gradient_count = 4
gradient_color_1 = '#cba6f7'
gradient_color_2 = '#f5c2e7'
gradient_color_3 = '#b4befe'
gradient_color_4 = '#89b4fa'

[smoothing]
noise_reduction = 77
