# cava config used by the eww music widget (~/.config/eww/scripts/cava.sh)
# Prints one line of numbers 0-100 per frame; the script turns it into a JSON list
[general]
bars = 28
framerate = 30
sleep_timer = 3

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
