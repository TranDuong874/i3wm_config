# ncspot (snap) config — lives in the snap's own folder because the snap can't read ~/.config.
# Opened with Alt+m (~/.local/bin/music). Catppuccin Mocha colors.
use_nerdfont = true          # kitty maps Nerd Font icons
gapless = true
volnorm = true               # even out loudness between tracks
default_keybindings = true

[theme]
background = "#1e1e2e"
primary = "#cdd6f4"
secondary = "#a6adc8"
title = "#cba6f7"
playing = "#cba6f7"
playing_selected = "#f5c2e7"
playing_bg = "#1e1e2e"
highlight = "#1e1e2e"
highlight_bg = "#cba6f7"
highlight_inactive_bg = "#45475a"
error = "#1e1e2e"
error_bg = "#f38ba8"
statusbar = "#1e1e2e"
statusbar_progress = "#cba6f7"
statusbar_bg = "#cba6f7"
cmdline = "#cdd6f4"
cmdline_bg = "#181825"
search_match = "#f38ba8"
